<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  
  <header class="bg-light">
    <div class="container">
      <nav class="navbar navbar-light bg-light">
        <a class="navbar-brand" href="#">Posts</a>
      </nav>
    </div>
  </header>

  <main>

    <div class="container">
      <div class="container area">
      
          <div class="create-post mt-5 bg-light p-3 rounded">
            <input type="text" class="form-control" id="title" placeholder="What is in your mind?..">
            <textarea class="form-control mt-3" placeholder="Explain..." id="desc"></textarea>
            <button onclick="addPost()" class="btn btn-info mt-3 add" id="addPost">Add Post</button>
          </div>
        
      </div>
    </div>

    <div class="posts mt-4">
      <div class="container">

        <div class="real-time-search mb-4 d-flex gap-3 p-3 bg-light rounded">
          <input type="text" class="form-control" placeholder="Search..." id="search">
          <button class="btn btn-info" id="searchBtn">Search</button>
        </div>

        <div class="row" id="data">
          
          
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
  <script src="./js/client.js"></script>
</body>
</html>
